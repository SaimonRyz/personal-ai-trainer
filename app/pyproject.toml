[project]
name = "personal-ai-trainer"
version = "0.1.0"
description = "Local technical foundation for the Personal AI Trainer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1.0",
  "mcp>=1,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3,<5",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
trainer = "trainer.lifecycle.cli:main"
trainer-api = "trainer.entrypoints.api:run"
trainer-db-bootstrap = "trainer.entrypoints.db_bootstrap:main"
trainer-db-verify = "trainer.entrypoints.db_verify:main"
trainer-migrate = "trainer.entrypoints.migrate:main"
trainer-mcp = "trainer_mcp.server:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer", "mcp/trainer_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trainer", "trainer_mcp"]
mypy_path = ["src", "mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: verifies isolated technical behavior",
  "architecture: verifies dependency boundaries",
  "contract: verifies HTTP or MCP wire contracts",
  "integration: requires PostgreSQL or Docker",
  "compose: requires Docker Compose",
  "migration: verifies PostgreSQL schema migrations",
  "security: verifies locality, authorization, and redaction",
  "spike: exercises the MCP integration spike",
]
